<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reports - Campus Lost and Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/my-reports.css" rel="stylesheet">
</head>

<body>

  <nav class="switcher">
    <div class="switcher-inner flex items-center gap-3">
      <span class="brand mono lh-1 text-center">Campus<br>Lost &amp; Found</span>
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-expanded="false" aria-controls="nav-links" aria-label="Toggle navigation menu"></button>
      <ul class="switcher-links flex items-center gap-1 nowrap" id="nav-links">
        <li><a class="nav-link" href="index.html">Login</a></li>
        <li><a class="nav-link" href="browse.html">Main</a></li>
        <li><a class="nav-link" href="report.html">Create Report</a></li>
        <li><a class="nav-link" href="item-detail.html">Item Detail</a></li>
        <li><a class="nav-link" href="search-filter.html">Search &amp; Filter</a></li>
        <li><a class="nav-link active" href="my-reports.html">My Reports</a></li>
      </ul>
    </div>
  </nav>

  <div class="screen-wrap">
    <div class="screen-label">
      <h2>6 - My Reports View</h2>
    </div>
    <div class="device">
      <div class="wf-navbar">
        <div class="wf-logo"><span class="dot"></span> Campus Lost &amp; Found</div>
        <div class="wf-navlinks">
          <a href="browse.html" class="no-underline">Browse</a>
          <a href="my-reports.html" class="no-underline">My Reports</a>
        </div>
      </div>
      <div class="p-4">
        <p id="reports-message" role="status" aria-live="polite">Loading your reports…</p>

        <section aria-labelledby="found-heading" class="mb-4">
          <h3 id="found-heading" class="kicker mono mb-2">Items I Found (0)</h3>
          <div id="found-reports" class="box" style="border-radius:4px; overflow:hidden;"></div>
        </section>

        <section aria-labelledby="lost-heading">
          <h3 id="lost-heading" class="kicker mono mb-2">Items I Lost (0)</h3>
          <div id="lost-reports" class="box" style="border-radius:4px; overflow:hidden;"></div>
        </section>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/my-reports.js"></script>
  <script src="js/mobile-menu.js"></script>
</body>

</html>
