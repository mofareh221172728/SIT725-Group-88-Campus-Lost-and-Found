<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Campus Lost and Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>

<body>

  <!-- Responsive Navigation With Hamburger Menu -->
  <nav class="switcher" role="navigation" aria-label="Main navigation">
    <div class="switcher-inner flex items-center gap-3">
      <!-- Brand Logo -->
      <span class="brand mono lh-1 text-center">Campus<br>Lost &amp; Found</span>

      <!-- Mobile Menu Toggle Button -->
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-expanded="false" aria-controls="nav-links" aria-label="Toggle navigation menu">
      </button>

      <!-- Navigation Links (Collapsible on Mobile) -->
      <ul class="switcher-links flex items-center gap-1 nowrap" id="nav-links" role="menu">
        <li role="none"><a class="nav-link" href="index.html" role="menuitem">Login</a></li>
        <li role="none"><a class="nav-link" href="browse.html" role="menuitem">Main</a></li>
        <li role="none"><a class="nav-link" href="report.html" role="menuitem">Create Report</a></li>
        <li role="none"><a class="nav-link" href="item-detail.html" role="menuitem">Item Detail</a></li>
        <li role="none"><a class="nav-link" href="search-filter.html" role="menuitem">Search &amp; Filter</a></li>
        <li role="none"><a class="nav-link" href="my-reports.html" role="menuitem">My Reports</a></li>
        <li role="none"><a class="nav-link active" href="admin.html" role="menuitem">Admin</a></li>
      </ul>
    </div>
  </nav>

  <div class="screen-wrap">
    <div class="screen-label">
      <h2>Admin Panel</h2>
    </div>

    <div class="device">
      <!-- In-App Navigation Bar -->
      <div class="wf-navbar">
        <div class="wf-logo"><span class="dot"></span> Campus Lost &amp; Found</div>
        <div class="wf-navlinks">
          <a href="browse.html" class="no-underline">Browse</a>
          <a href="my-reports.html" class="no-underline">My Reports</a>
          <a href="admin.html" class="no-underline">Admin</a>
        </div>
      </div>

      <div class="p-4">
        <!-- Shown until the admin check finishes; the panel stays hidden for non-admins -->
        <div id="admin-status" class="browse-message" role="status" aria-live="polite">
          Checking admin access…
        </div>

        <div id="admin-content" class="d-none">
          <section aria-labelledby="bulk-actions-heading">
            <div class="kicker mono mb-2" id="bulk-actions-heading">Bulk Actions</div>
            <div class="card-wf">
              <div class="ph" style="height:140px;">Bulk actions placeholder</div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/mobile-menu.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>

</body>

</html>
