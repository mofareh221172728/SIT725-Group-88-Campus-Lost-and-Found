<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search &amp; Filter - Campus Lost and Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/search-filter.css" rel="stylesheet">
</head>

<body>

  <nav class="switcher">
    <div class="switcher-inner flex items-center gap-3">
      <span class="brand mono lh-1 text-center">Campus<br>Lost &amp; Found</span>
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-expanded="false" aria-controls="nav-links" aria-label="Toggle navigation menu"></button>
      <ul class="switcher-links flex items-center gap-1 nowrap" id="nav-links">
        <li><a class="nav-link" href="index.html">Login</a></li>
        <li><a class="nav-link" href="browse.html">Main</a></li>
        <li><a class="nav-link" href="report.html">Create Report</a></li>
        <li><a class="nav-link" href="item-detail.html">Item Detail</a></li>
        <li><a class="nav-link active" href="search-filter.html">Search &amp; Filter</a></li>
        <li><a class="nav-link" href="my-reports.html">My Reports</a></li>
      </ul>
    </div>
  </nav>

  <div class="screen-wrap">
    <div class="screen-label">
      <h2>Search &amp; Filter View</h2>
    </div>
    <div class="device">
      <div class="wf-navbar">
        <div class="wf-logo"><span class="dot"></span> Campus Lost &amp; Found</div>
        <div class="wf-navlinks">
          <a href="browse.html" class="no-underline">Browse</a>
          <a href="my-reports.html" class="no-underline">My Reports</a>
        </div>
      </div>
      <div class="search-layout">
        <form id="search-filter-form" class="search-sidebar p-3">
          <div class="kicker mono mb-2">Filters</div>

          <div class="field-wf mb-3">
            <label>Type</label>
            <div class="flex gap-2 wrap" data-toggle-group="filter-type">
              <button type="button" class="chip-btn" data-toggle-option="lost" aria-pressed="false">Lost</button>
              <button type="button" class="chip-btn" data-toggle-option="found" aria-pressed="false">Found</button>
              <button type="button" class="chip-btn active" data-toggle-option="all" aria-pressed="true">All</button>
            </div>
          </div>

          <div class="field-wf mb-3">
            <label for="filter-category">Category</label>
            <select id="filter-category" class="select-wf">
              <option value="">All categories</option>
              <option>Electronics</option>
              <option>Keys</option>
              <option value="Bags &amp; Backpacks">Bags</option>
              <option value="Cards &amp; Wallets">Wallets / Cards</option>
              <option>Clothing</option>
              <option value="Books &amp; Stationery">Books &amp; Stationery</option>
              <option>Other</option>
            </select>
          </div>
          <div class="field-wf mb-3">
            <label for="filter-building">Building / campus</label>
            <select id="filter-building" class="select-wf">
              <option value="">All campuses</option>
              <option>Waurn Ponds</option>
              <option>Burwood</option>
              <option value="Waterfront">Geelong Waterfront</option>
              <option>Warrnambool</option>
            </select>
          </div>
          <div class="field-wf mb-3">
            <label>Date range</label>
            <div class="search-date-range">
              <div>
                <label for="filter-from-date">From</label>
                <input id="filter-from-date" type="date" class="input-wf-real">
              </div>
              <div>
                <label for="filter-to-date">To</label>
                <input id="filter-to-date" type="date" class="input-wf-real">
              </div>
            </div>
          </div>
          <div class="field-wf mb-3">
            <label for="filter-keyword">Keyword</label>
            <input id="filter-keyword" type="text" class="input-wf-real" placeholder="e.g. keys, wallet…">
          </div>
          <button type="submit" class="btn-wf-strong w-100" data-action="apply-filters">Apply filters</button>
          <div class="text-center mt-2">
            <button type="button" id="clear-filters" class="btn-link-wf" data-action="clear-filters">Clear all filters</button>
          </div>
        </form>

        <div id="search-results" class="search-results p-3" aria-busy="false">
          <div class="flex justify-between items-center mb-3">
            <span id="search-count" class="mono" role="status"></span>
            <select id="search-sort" class="select-wf-inline" aria-label="Sort results">
              <option value="newest">Sort: Newest</option>
              <option value="oldest">Sort: Oldest</option>
            </select>
          </div>
          <p id="search-status" class="browse-message" role="status">Loading reports...</p>
          <div id="search-grid" class="grid grid-3"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/search-filter.js"></script>
  <script src="js/mobile-menu.js"></script>
</body>

</html>
