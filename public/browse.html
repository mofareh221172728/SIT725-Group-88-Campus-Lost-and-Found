<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Main Browse - Campus Lost and Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/browse.css" rel="stylesheet">
</head>

<body>

  <!-- Responsive Navigation with Mobile Hamburger Menu -->
  <nav class="switcher" role="navigation" aria-label="Main navigation">
    <div class="switcher-inner flex items-center gap-3">
      <!-- Brand Logo -->
      <span class="brand mono lh-1 text-center">Campus<br>Lost &amp; Found</span>
      
      <!-- Mobile Menu Toggle Button -->
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-expanded="false" aria-controls="nav-links" aria-label="Toggle navigation menu">
      </button>
      
      <!-- Navigation Links (Collapsible on Mobile) -->
      <ul class="switcher-links flex items-center gap-1 nowrap" id="nav-links" role="menu">
        <li role="none"><a class="nav-link" href="index.html" role="menuitem">Login</a></li>
        <li role="none"><a class="nav-link active" href="browse.html" role="menuitem">Main</a></li>
        <li role="none"><a class="nav-link" href="report.html" role="menuitem">Create Report</a></li>
        <li role="none"><a class="nav-link" href="item-detail.html" role="menuitem">Item Detail</a></li>
        <li role="none"><a class="nav-link" href="search-filter.html" role="menuitem">Search &amp; Filter</a></li>
        <li role="none"><a class="nav-link" href="my-reports.html" role="menuitem">My Reports</a></li>
      </ul>
    </div>
  </nav>

  <div class="screen-wrap">
    <div class="screen-label">
      <h2>Main Browse View</h2>
    </div>

    <div class="device">
      <!-- In-App Navigation Bar -->
      <div class="wf-navbar">
        <div class="wf-logo"><span class="dot"></span> Campus Lost &amp; Found</div>
        <div class="wf-navlinks">
          <a href="browse.html" class="no-underline">Browse</a>
          <a href="my-reports.html" class="no-underline">My Reports</a>
          <a href="report.html" class="no-underline">+ Report Item</a>
        </div>
      </div>

      <!-- Main Content -->
      <div class="p-3">
        <!-- Search and Filter Bar -->
        <div class="flex gap-2 items-center mb-3" style="flex-wrap: wrap;">
          <input 
            type="text" 
            class="input-wf-real" 
            style="flex: 1; min-width: 200px; max-width:420px;" 
            placeholder='Search keyword… ("blue bottle")'
            aria-label="Search for lost or found items"
          >
          <a href="search-filter.html" class="btn-wf" aria-label="Open advanced filters">Filters ⚙</a>
        </div>

        <!-- Tab Navigation -->
        <div class="tabline mb-3" data-toggle-group="browse-tab">
          <button type="button" class="tab-btn active" data-toggle-option="found">Found (128)</button>
          <button type="button" class="tab-btn" data-toggle-option="lost">Lost (94)</button>
          <button type="button" class="tab-btn" data-toggle-option="all">All</button>
        </div>

        <!-- Browse Status Message -->
        <div id="browse-status" class="browse-message" role="status" aria-live="polite">
          Loading reports…
        </div>

        <!-- Report Cards Grid (Responsive) -->
        <div id="report-grid" class="grid grid-4" aria-label="Active lost and found reports"></div>

        <!-- Pagination -->
        <div class="flex justify-center gap-1 mt-4" data-toggle-group="browse-page">
          <button type="button" class="pill-btn" disabled aria-label="Previous page">‹</button>
          <button type="button" class="pill-btn active" data-toggle-option="1">1</button>
          <button type="button" class="pill-btn" data-toggle-option="2">2</button>
          <button type="button" class="pill-btn" data-toggle-option="3">3</button>
          <button type="button" class="pill-btn" disabled>…</button>
          <button type="button" class="pill-btn" data-toggle-option="next" aria-label="Next page">›</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/mobile-menu.js"></script>
  <script src="js/main.js"></script>
  <script src="js/browse.js"></script>
</body>

</html>
