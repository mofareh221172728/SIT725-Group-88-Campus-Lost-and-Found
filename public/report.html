<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report an Item - Campus Lost &amp; Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Materialize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/report.css">
</head>

<body>

    <nav class="switcher">
        <div class="switcher-inner flex items-center gap-3">

            <span class="brand mono lh-1 text-center">
                Campus<br>Lost &amp; Found
            </span>

            <ul class="switcher-links flex items-center gap-1 nowrap">
                <li><a class="nav-link" href="index.html">Login</a></li>
                <li><a class="nav-link" href="browse.html">Main</a></li>
                <li><a class="nav-link active" href="create-report.html">Create Report</a></li>
                <li><a class="nav-link" href="item-detail.html">Item Detail</a></li>
                <li><a class="nav-link" href="search-filter.html">Search &amp; Filter</a></li>
                <li><a class="nav-link" href="my-reports.html">My Reports</a></li>
            </ul>

        </div>
    </nav>

    <div class="screen-wrap">

        <div class="screen-label">
            <h2>Create Report</h2>
        </div>

        <div class="device">

            <div class="wf-navbar">

                <div class="wf-logo">
                    <span class="dot"></span>
                    Campus Lost &amp; Found
                </div>

                <div class="wf-navlinks">
                    <a href="browse.html" class="no-underline">
                        ← Back to Browse
                    </a>
                </div>

                <div class="wf-avatar"></div>

            </div>

            <!-- Report form container -->
            <div class="report-container">

                <!-- Mode Toggle -->
                <div class="mode-toggle" role="radiogroup" aria-label="Report Type Selection">
                    <button type="button" id="btn-mode-lost" class="btn mode-btn waves-effect" role="radio"
                        aria-checked="false">
                        I Lost Something
                    </button>
                    <button type="button" id="btn-mode-found" class="btn mode-btn active waves-effect waves-light"
                        role="radio" aria-checked="true">
                        I Found Something
                    </button>
                </div>

                <form id="report-item-form">
                    <input type="hidden" id="report-type" name="type" value="found">

                    <!-- General Item Information -->
                    <h5>Item Overview</h5>

                    <div class="row">
                        <div class="input-field col s12">
                            <input type="text" id="item-title" name="title" class="validate" required>
                            <label for="item-title">Item Title</label>
                        </div>
                    </div>

                    <div class="row">
                        <div class="input-field col s12 m6">
                            <select id="item-category" name="category" required>
                                <option value="" disabled selected>Choose a category</option>
                                <option value="Electronics">Electronics (Laptops, Phones, Audio)</option>
                                <option value="Cards & Wallets">Student Cards, Wallets, IDs</option>
                                <option value="Keys">Keys &amp; Security Tokens</option>
                                <option value="Bags & Backpacks">Bags, Backpacks, Cases</option>
                                <option value="Clothing">Clothing &amp; Accessories</option>
                                <option value="Books & Stationery">Books &amp; Stationery</option>
                                <option value="Other">Other Items</option>
                            </select>
                            <label>Category</label>
                        </div>

                        <div class="input-field col s12 m6">
                            <input type="date" id="item-date" name="date" class="validate" required>
                            <label for="item-date" class="active" id="date-label">Date Found</label>
                        </div>
                    </div>

                    <div class="row">
                        <div class="input-field col s12">
                            <textarea id="item-desc" name="description" class="materialize-textarea"
                                required></textarea>
                            <label for="item-desc">Detailed Description</label>
                        </div>
                    </div>

                    <!-- Location Information -->
                    <h5 id="location-heading">Discovery Location</h5>

                    <div class="row">
                        <div class="input-field col s12 m4">
                            <select id="item-campus" name="campus" required>
                                <option value="" disabled selected>Choose campus</option>
                                <option value="Burwood">Melbourne Burwood</option>
                                <option value="Waurn Ponds">Geelong Waurn Ponds</option>
                                <option value="Waterfront">Geelong Waterfront</option>
                                <option value="Warrnambool">Warrnambool</option>
                            </select>
                            <label>Campus</label>
                        </div>

                        <div class="input-field col s12 m4">
                            <input type="text" id="item-building" name="building" class="validate" required>
                            <label for="item-building">Building</label>
                        </div>

                        <div class="input-field col s12 m4">
                            <input type="text" id="item-room" name="room" class="validate">
                            <label for="item-room">Room / Area (Optional)</label>
                        </div>
                    </div>

                    <!-- Collection & Handover Method (Found Only) -->
                    <div id="section-found-collection">
                        <h5>Collection &amp; Handover Method</h5>

                        <p>
                            <label>
                                <input name="handoverMethod" type="radio" value="dropoff" checked>
                                <span>Handed to Campus Security / Student Central</span>
                            </label>
                        </p>

                        <p>
                            <label>
                                <input name="handoverMethod" type="radio" value="email">
                                <span>Direct Contact via Deakin Email</span>
                            </label>
                        </p>

                    </div>

                    <!-- Photo Upload using Materialize CSS File Field -->
                    <h5>Item Photos (Up to 3)</h5>
                    <div class="row">
                        <div class="file-field input-field col s12">
                            <div id="upload-photo-btn" class="btn waves-effect waves-light">
                                <span>File</span>
                                <input type="file" id="item-photos" name="photos" accept="image/*" multiple>
                            </div>
                            <div class="file-path-wrapper">
                                <input class="file-path validate" type="text" placeholder="Upload one or more photos">
                            </div>
                        </div>
                    </div>

                    <!-- Form Actions -->
                    <div class="row form-actions">
                        <a href="browse.html" class="btn-flat waves-effect">Cancel</a>
                        <button type="submit" id="btn-submit-report" class="btn waves-effect waves-light">
                            Submit Report
                        </button>
                    </div>
                </form>

            </div>

        </div>

    </div>

    <!-- Materialize JS and Form Logic -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="js/report-form.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            M.AutoInit();
        });
    </script>
</body>

</html>
