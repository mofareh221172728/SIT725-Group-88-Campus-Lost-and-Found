<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View a selected campus lost or found item report.">
  <title>Item Detail - Campus Lost and Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>

<body>
  <nav class="switcher" aria-label="Main navigation">
    <div class="switcher-inner flex items-center gap-3">
      <span class="brand mono lh-1 text-center">Campus<br>Lost &amp; Found</span>
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-expanded="false" aria-controls="nav-links" aria-label="Toggle navigation menu"></button>
      <ul class="switcher-links flex items-center gap-1 nowrap" id="nav-links">
        <li><a class="nav-link" href="index.html">Login</a></li>
        <li><a class="nav-link" href="browse.html">Main</a></li>
        <li><a class="nav-link" href="report.html">Create Report</a></li>
        <li><a class="nav-link active" href="item-detail.html">Item Detail</a></li>
        <li><a class="nav-link" href="search-filter.html">Search &amp; Filter</a></li>
        <li><a class="nav-link" href="my-reports.html">My Reports</a></li>
      </ul>
    </div>
  </nav>

  <main class="screen-wrap">
    <div class="screen-label"><h2>Item Detail View</h2></div>
    <article class="device" aria-labelledby="item-title">
      <div class="wf-navbar">
        <div class="wf-logo"><span class="dot"></span> Campus Lost &amp; Found</div>
        <div class="wf-navlinks"><a href="browse.html" class="no-underline">← Back to results</a></div>
      </div>

      <div id="item-detail-message" class="browse-message" role="status" aria-live="polite">
        Loading report…
      </div>

      <div id="item-detail-content" class="item-detail-layout p-4" hidden>
        <section id="item-photos" class="item-photo-grid" aria-label="Item photos"></section>

        <section class="item-detail-copy">
          <div class="flex items-center gap-2 mb-2">
            <span id="item-type" class="badge-wf"></span>
            <span id="item-status" class="badge-wf"></span>
          </div>

          <h1 id="item-title" class="item-detail-title"></h1>
          <p id="item-description" class="item-detail-description"></p>

          <dl class="item-detail-fields">
            <dt>Category</dt><dd id="item-category"></dd>
            <dt id="item-date-label">Relevant date</dt><dd id="item-date"></dd>
            <dt>Campus location</dt><dd id="item-location"></dd>
            <dt>Reported date</dt><dd id="item-reported-date"></dd>
          </dl>

          <section id="item-contact" class="box-strong item-contact-panel" hidden>
            <h2 id="item-contact-heading" class="kicker mono"></h2>
            <p id="item-contact-copy" class="item-contact-copy"></p>
          </section>
        </section>
      </div>
    </article>
  </main>

  <script src="js/mobile-menu.js"></script>
  <script src="js/api.js"></script>
  <script src="js/item-detail.js"></script>
</body>

</html>
